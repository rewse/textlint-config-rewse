name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "11 11 * * 3"  # Every Wednesday at 20:11 JST (11:11 UTC)
  workflow_dispatch:

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install latest npm
        run: npm install -g npm@latest

      # The installer is downloaded to a file rather than piped into sh: the
      # exit status of `curl | sh` is sh's, so a failed download passes the
      # step and leaves npm unshimmed, which then rejects the --safe-chain-*
      # flag below with EUNKNOWNCONFIG instead of reporting the real cause.
      - name: Setup Aikido Safe Chain
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/AikidoSec/safe-chain/main/install-scripts/install-safe-chain.sh \
            -o /tmp/install-safe-chain.sh
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh

      # A separate step because the installer publishes its shim directory
      # through GITHUB_PATH, which only takes effect in later steps.
      - name: Verify Aikido Safe Chain
        run: npm safe-chain-verify

      - name: Install dependencies
        run: npm ci --safe-chain-skip-minimum-package-age

      - name: Test
        run: npm test

  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
