name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "11 11 * * 3"  # Every Wednesday at 20:11 JST (11:11 UTC)
  workflow_dispatch:

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install latest npm
        run: npm install -g npm@latest

      # Pinned to a release URL with a checksum so a tampered or truncated
      # installer cannot run; the release pipeline bakes the matching binary
      # version and its checksum into that script. Each command is its own
      # line because a piped `curl | sh` hides a download failure and leaves
      # npm unshimmed, which then rejects the --safe-chain-* flag below.
      # SAFE_CHAIN_VERSION is deliberately not used: the installer treats it
      # as a deprecated legacy switch and downloads a binary name that no
      # longer exists.
      - name: Setup Aikido Safe Chain
        env:
          INSTALLER_SHA256: 'de0565e3d6346407a604e84e639e95fea8758748063da2216bbfdca5feda5dd2'
          INSTALLER_VERSION: '1.5.15'
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/AikidoSec/safe-chain/releases/download/${INSTALLER_VERSION}/install-safe-chain.sh" \
            -o /tmp/install-safe-chain.sh
          echo "${INSTALLER_SHA256}  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh

      # A separate step because the installer publishes its shim directory
      # through GITHUB_PATH, which only takes effect in later steps.
      - name: Verify Aikido Safe Chain
        run: npm safe-chain-verify

      - name: Install dependencies
        run: npm ci --safe-chain-skip-minimum-package-age

      - name: Test
        run: npm test

  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
